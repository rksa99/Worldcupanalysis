# Render blueprint — deploy with "New + > Blueprint" at https://dashboard.render.com
services:
  - type: web
    name: worldcup-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m worldcup.web
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # The Odds API key for multi-sportsbook consensus odds (optional but
      # recommended). Set the value in the Render dashboard, never in git.
      - key: ODDS_API_KEY
        sync: false
